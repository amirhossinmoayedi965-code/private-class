<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Selector */
      /* Element Selector */
      p {
        font-size: 40px;
      }
      button {
        font-size: 20px;
      }

      /* ID Selector */
      #p-1 {
        background-color: rgb(149, 167, 10);
        border: 12px solid slateblue;
      }

      #p-2 {
        background-color: transparent;
        text-shadow: 20px 10px 9px;
      }
    </style>
  </head>
  <body>
    <div>
      <!--inline style-->
      <p id="p-1">Hello</p>
      <p id="p-2">Welcome to my site</p>
      <p
        id="p-3"
        style="background-color: rgb(186, 63, 205); color: rgb(0, 255, 51)"
      >
        Use navbar
      </p>
      <button
        style="background-color: rgb(122, 205, 63); color: rgb(255, 0, 34)"
      >
        Submit your change
      </button>
    </div>
  </body>
</html>
