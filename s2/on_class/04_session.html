<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* eleemnt selector */
      input {
        background-color: blue;
      }
      div {
        background-color: aquamarine;
      }

      /* ID Selector */
      #div1 {
        background-color: cadetblue;
        border: 40px solid brown;
      }

      /* class selector */
      .bbb {
        background-color: darkolivegreen;
      }

      .dark {
        background-color: black;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="div1">
      <p class="dark">Hello</p>
      <h1 class="dark">asd</h1>
    </div>
    <div class="bbb">
      <button>ثبت</button>
      <input type="text" />
      <input class="dark" type="color" />
      <input type="file" />
    </div>
    <div class="bbb">
      <p class="dark">Jack</p>
      <p class="dark">James</p>
    </div>
  </body>
</html>
