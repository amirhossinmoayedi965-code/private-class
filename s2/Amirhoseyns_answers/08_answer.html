<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #div1 {
            background-color: bisque;
            border-radius: 24px;
            display: flex;
            flex-direction: row;
            padding: 20px;
            gap: 30px;
            margin-bottom: 30px;
        }

        .div2 {
            background-color: bisque;
            border-radius: 20px;
            display: flex;
            flex-direction: row;
            padding: 20px;
            gap: 16px;
            margin-bottom: 30px;
        }

        #category {
            background-color: bisque;
            border-radius: 20px;
            display: flex;
            flex-direction: row;
            padding: 20px;
            gap: 20px;
            margin-bottom: 30px;
        }

        #Ha{
            width: 400px;
            height: 100px;
        }

        #Am{
            width: 285px;
            height: 100px;
            font-size: 22px;
        }

        select {
            width: 210px;
            height: 100px;
            font-size: 24px;
        }

        label {
            font-size: 30px;
        }

        button {
            font-size: 28px;
        }
    </style>
</head>

<body>

    <div id="div1">
        <label>Name</label>
        <input id="Ha" type="text">
    </div>

    <div class="div2">
        <label>Year of Production</label>
        <input id="Am" type="date">
    </div>

    <div id="category">
        <label>Category</label>
        <select>
            <option value="grocery">Grocery</option>
            <option value="clothes">Clothes</option>
            <option value="electronics">Electronics</option>
            <option value="other">Other</option>
        </select>
    </div>

    <button>Create</button>

</body>
</html>
