
<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ساخت محصول</title>

    <!-- Internal CSS -->
    <style>
        body {
            background-color: lightgray;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        p {
            font-size: 18px;
        }

        /* External CSS (نمونه داخل همین فایل) */
        input {
            width: 200px;
            height: 22px;
        }

        select {
            width: 100px;
            height: 30px;
        }

        button {
            background-color: green;
            color: white;
            border: 1px solid gray;
            padding: 5px 10px;
        }
    </style>

</head>

<body>

    <!-- Inline CSS -->
    <h1 style="color: blue;">ساخت محصول</h1>

    <p>
        نام محصول:
        <input type="text">
    </p>

    <p>
        قیمت:
        <input type="number">
    </p>

    <p>
        دسته‌بندی:

        <select>
            <option>دیجیتال</option>
            <option>پوشاک</option>
            <option>خوراکی</option>
        </select>
    </p>

    <button>ساخت محصول</button>

</body>
</html>
