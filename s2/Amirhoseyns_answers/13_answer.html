<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .one{
            position: absolute;
            display: flex;
            margin: 0;
            width: 60px;
            height: 60px;
            background-color: brown;
            align-items: center;
            justify-content: center;
            top: 0;
            left: 0;
            
            
        }

             display: flex;
            margin: 0;
            width: 60px;
            height: 60px;
            background-color: rgb(0, 187, 255);
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 30px;
            left: 30px;
        }
        .three{
            display: flex;
            margin: 0;
            width: 60px;
            height: 60px;
            background-color: rgb(0, 255, 128);
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 60px;
            left: 60px;
        }
    </style>
</head>
<body>
    <p class="one">1</p>
    <p class="two">2</p>
    <p class="three">3</p>

</html>
