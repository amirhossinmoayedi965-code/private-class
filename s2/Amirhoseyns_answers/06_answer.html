<!DOCTYPE html>
<html lang="en"dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انجام تمرین برای قوی تر شدن</title>
    <style>
        div{
            display: inline-block;
            background-color: cornflowerblue;
            margin: 40px;
            padding: 40px;
            border: 10px solid green;
            
        }
        #Developer{
            display: inline-block;
            border: 10px solid brown;
            background-color: darkcyan;
            margin: 12px;
            padding: 10px;
          
        }
        .Web{
            display: inline-block;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: larger;
            border: 26px;
            

        }
        #Hadi{
            display: inline-flex;
            color: burlywood;            
            font-weight: 100;
        }
        .St{
            color: chocolate;
            background-color: aquamarine;
        }
        label{
            display: inline;
            border: 12px solid;
            margin: 10px;
            padding: 16px;
            font-size: large;
            
        }
    </style>
</head>
<body>
    <div>
        <h1 id="Developer">به نام خداوند متعال</h1>
        <p class="Web">عنوان اصلی صفحه</p>
        <h4 id="Hadi">ثبت نام</h4>
        <input type="text">
        <p-2 class="St">دانشجو</p-2>
        <label>نام و نام خانوادگی</label>
        
    </div>
</body>
</html>
