<!DOCTYPE html>
<html lang="en"dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تمرین</title>
    <style>
         div{ display: inline-block;
            background-color: #fff9e6;
            border: 2px solid goldenrod;
            padding: 12px;
            margin: 20px;
         }
        h1{
            background-color: lightblue;
            border: 2px solid blue;
            padding: 5px;
            margin: 0 0 20px 0;
            font-size: 30px;

        }
        label{
            display: inline;
            margin-left: 20px;
        }
        input{
           display: inline;
            width: 200px;
            height: 22px;
        }
    </style>
</head>
<body>
    <div>
        <h1>خوش آمدید</h1>
        <label>نام خود را وارد کنید</label>
        <input type="text">
    </div>
</body>
</html>
